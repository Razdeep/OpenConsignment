# Gradle 7.6's Groovy/Ant integration uses reflection to clean Java preferences listeners.
# This runs in the Gradle daemon (for example during jacocoTestReport), not the test JVM.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED
